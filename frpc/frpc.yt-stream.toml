# frpc — expose the local yt-stream instance via the Ubuntu frp server.
# Run on the Mac:  frpc -c frpc.toml
# Requires frpc (v0.71.0): https://github.com/fatedier/frp/releases

serverAddr = "yt-stream.charugin.me"
serverPort = 7000

# yt-stream API (stream-service) — http://<server>:8870
[[proxies]]
name = "yts"
type = "https"
customDomains = ["yts.charugin.me"]

[proxies.plugin]
type = "https2http"
localAddr = "yts.localhost"
crtPath = "/Users/roman.charugin/.config/certs/yts.charugin.me/fullchain.pem"
keyPath = "/Users/roman.charugin/.config/certs/yts.charugin.me/privkey.pem"
hostHeaderRewrite = "yts.localhost"
requestHeaders.set.x-from-where = "frp"

