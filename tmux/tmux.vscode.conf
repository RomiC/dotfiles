# Custom config for VSCode integrated terminal
source-file $HOME/.config/tmux/tmux.common.conf

# Keybindings
# - Reload config
unbind-key r
bind-key r source-file $HOME/.config/tmux/tmux.vscode.conf

# Allow switching the currently focused pane by mouse click.
setw -g mouse on

# Status bar VSCode theme
set -g status-left ''
set -g status-right ''
set -g status-justify left
set -g window-status-format '#I:#W'
set -g window-status-current-style none
set -g window-status-current-format '#[fg=#f0c674]⋅ #W#{?#{>:#{window_panes},1},*,}'
set -g status-style 'bg=#2c2c2c,fg=#d6d6d6'

# Additional env variables
set -ga update-environment "CLAUDE_CODE_MAX_CONTEXT_TOKENS ANTHROPIC_BASE_URL ANTHROPIC_AUTH_TOKEN NODE_EXTRA_CA_CERTS PI_CODING_AGENT_DIR"
