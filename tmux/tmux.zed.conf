# Custom config for Zed integrated terminal
source-file $HOME/.config/tmux/tmux.common.conf

# Match Ghostty: Zed's process env carries EDITOR, which flips new zsh panes to the vi keymap
set-environment -gu EDITOR

# Keybindings
# - Reload config
unbind-key r
bind-key r source-file $HOME/.config/tmux/tmux.zed.conf
# - Refresh Acronis token in a popup; closes automatically on success, waits on failure
#   zsh -ic re-runs the fnm hook so acronis-mcp-hub resolves (tmux forces a minimal PATH)
bind-key t display-popup -E -w 60 -h 10 "zsh -ic 'acronis-mcp-hub refresh-token && { echo; echo Token refreshed OK; sleep 2; } || { echo; echo Refresh failed - press Enter to close; read; }'"

# Allow switching the currently focused pane by mouse click.
setw -g mouse on

# Status bar Zed theme
set -g status-left ''
set -g status-right ''
set -g status-justify left
set -g window-status-format '#I:#W'
set -g window-status-current-format '#[fg=#f0c674]⋅ #W#{?#{>:#{window_panes},1},*,}'
set -g status-style 'bg=#2c2c2c,fg=#d6d6d6'
