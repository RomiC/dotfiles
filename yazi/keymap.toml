# Yazi keymap configuration
# Extends the default keymap with bookmark shortcuts

[mgr]
prepend_keymap = [
  # ── Git ──────────────────────────────────────────────────────────────────
  { on = ["<C-g>"], run = "shell --block '~/.config/yazi/scripts/lazygit-popup.sh'", desc = "Open lazygit in tmux popup" },

  # ── Bookmarks ─────────────────────────────────────────────────────────────
  { on = ["g", "h"], run = "cd ~",             desc = "Bookmark: Home" },
  { on = ["g", "w"], run = "cd ~/work",         desc = "Bookmark: Work" },
  { on = ["g", "d"], run = "cd ~/Downloads",    desc = "Bookmark: Downloads" },
  { on = ["g", "s"], run = "cd ~/Screenshots",  desc = "Bookmark: Screenshots" },

  # ── Archive creation ──────────────────────────────────────────────────────
  { on = ["a", "z"], run = '''
    shell 'printf "Archive name: " > /dev/tty; read name; ~/.config/yazi/scripts/create-archive.sh zip "$name" "$@"' --block --confirm
  ''', desc = "Create zip archive from selected" },
  { on = ["a", "g"], run = '''
    shell 'printf "Archive name: " > /dev/tty; read name; ~/.config/yazi/scripts/create-archive.sh tar "$name" "$@"' --block --confirm
  ''', desc = "Create tar.gz archive from selected" },
]
