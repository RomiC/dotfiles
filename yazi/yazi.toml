# Yazi base configuration

[mgr]
ratio          = [1, 2, 6]   # panels: parent | current | preview (bigger)
sort_by        = "mtime"    # sort by modification time
sort_sensitive = false
sort_reverse   = true     # newest first
sort_dir_first = true     # folders on top
show_hidden    = true
show_symlink   = true

[preview]
tab_size      = 2
max_width     = 600
max_height    = 900
image_filter  = "lanczos3"   # sharper image scaling

[opener]
edit = [
  { run = 'nvim "$@"', desc = "nvim", block = true },
]

[open]
prepend_rules = [
  { mime = "text/*",             use = "edit" },
  { mime = "application/json",  use = "edit" },
  { mime = "application/toml",  use = "edit" },
]
